<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Finca Chate</title>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#20242d;--tx:#e8eaf0;--mut:#8b93a5;--ac:#f5a524;--ok:#2ecc71;--bad:#ff5d5d;--bd:#2b303b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
header b{color:var(--ac);letter-spacing:1px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--bg);position:sticky;top:48px;z-index:4}
nav button{flex:0 0 auto}
main{max-width:960px;margin:auto;padding:0 12px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
h3{margin:0 0 10px;font-size:16px}
label{display:block;color:var(--mut);font-size:12px;margin:10px 0 4px}
input,select{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:12px;font-size:16px}
button{background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:11px 14px;font-size:15px;cursor:pointer}
button.on,nav button.on{background:var(--ac);color:#111;border-color:var(--ac);font-weight:700}
button.pri{background:var(--ac);color:#111;font-weight:700;width:100%;margin-top:14px;padding:14px}
button.sec{background:var(--card2);color:var(--tx);border:1px solid var(--ac);width:100%;margin-top:10px;padding:14px;font-weight:700}
button.sm{padding:6px 10px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.tot{font-size:26px;color:var(--ac);font-weight:800}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left}th{color:var(--mut)}
.wrap{overflow-x:auto}.void{opacity:.4;text-decoration:line-through}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.kp div{background:var(--card2);border-radius:10px;padding:10px}.kp small{color:var(--mut);display:block}.kp b{font-size:18px}
.msg{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ok);color:#111;padding:10px 18px;border-radius:20px;display:none;z-index:99}
img.th{width:46px;height:46px;object-fit:cover;border-radius:6px;cursor:pointer}
.mut{color:var(--mut);font-size:12px}
.btnl{background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:11px 14px;text-align:center;cursor:pointer;font-size:15px;flex:1}
#cam{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}#cam video{flex:1;min-height:0;width:100%;object-fit:cover}
#lg{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}#lg .card{width:100%;max-width:360px}
#ld{position:fixed;top:0;left:0;right:0;height:3px;background:var(--ac);display:none;z-index:100}
.bars{display:flex;align-items:flex-end;gap:2px;height:150px;border-bottom:1px solid var(--bd)}.bars div{flex:1;background:var(--ac);border-radius:3px 3px 0 0;min-height:2px}
.bl{display:flex;gap:2px}.bl span{flex:1;text-align:center;font-size:9px;color:var(--mut)}
.hb{margin:8px 0}.hb .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}.hb .b{height:14px;background:var(--card2);border-radius:7px;overflow:hidden}.hb .b i{display:block;height:100%;border-radius:7px}
.red{color:var(--bad);font-weight:700}.org{color:var(--ac);font-weight:700}
</style>
</head>
<body>
<div id="ld"></div>
<div id="lg"><div class="card"><h3 style="color:var(--ac);font-size:22px;text-align:center">FINCA CHATE</h3><div class="mut" style="text-align:center">Ingresa para continuar</div><label>Usuario</label><input id="lu" autocapitalize="none" autocomplete="username"><label>Contraseña</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()"><div id="le" style="color:var(--bad);margin-top:8px;min-height:18px"></div><button class="pri" style="margin-top:6px" onclick="login()">INGRESAR</button></div></div>
<header><b id="br">FINCA CHATE</b><span><span class="mut" id="hoy"></span> <button class="sm" onclick="logout()">Salir</button></span></header>
<nav id="nav"></nav>
<main id="v"></main>
<div class="msg" id="msg"></div>
<div id="cam"><video id="cv" autoplay playsinline muted></video><div class="row" style="padding:12px"><button onclick="camX()">Cancelar</button><button class="on" onclick="camS()">📸 Capturar</button></div></div>
<script>
const $=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const def={v:2,emp:'FINCA CHATE',ruc:'',
mats:[['Arena gruesa',400,50],['Afirmado',350,45],['Piedra de 1/2',450,60],['Piedra 6/7',480,60],['Arena fina',480,60],['Piedra de sanja',450,45],['Tierra de chacra',0,80],['Hormigón',350,40],['Confitillo',500,60],['Piedra 3/4',400,50]].map(([n,pc,pq])=>({n,pc,pq})),
alq:[{n:'Cargador frontal',p:120},{n:'Excavadora',p:200},{n:'Retroexcavadora',p:110}],
chof:['Chofer 1','Chofer 2','Chofer 3','Chofer 4'],sue:[0,0,0,0],hext:10,jor:8,pd:0,pa:0,
maq:['Volquete 1','Volquete 2','Volquete 3','Burrito','Retroexcavadora']};
const clone=o=>JSON.parse(JSON.stringify(o));
const TIPOS=['ventas','alq','abo','gas','mant','poli','asis','pagos'];
let D={...clone(def)},HOY='',F=null,busy=0,CK,CS;TIPOS.forEach(t=>D[t]=[]);D.log=[];
const now=()=>new Date().toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit',hour12:false});
const S=n=>'S/ '+(+n||0).toFixed(2);
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const opts=a=>a.map(x=>`<option>${E(x)}</option>`).join('');
function wk(e,s){if(!e||!s)return 0;const[a,b]=e.split(':'),[c,d]=s.split(':');let m=(c*60+ +d)-(a*60+ +b);if(m<0)m+=1440;return m/60}
const hrs=a=>wk(a.e,a.s);
const fd=f=>f?f.split('-').reverse().join('/'):'';
const dias=f=>Math.max(0,Math.round((new Date(HOY+'T12:00:00')-new Date(f+'T12:00:00'))/864e5));
const toast=(t,bad)=>{const m=$('#msg');m.textContent=t;m.style.background=bad?'var(--bad)':'var(--ok)';m.style.display='block';clearTimeout(m.t);m.t=setTimeout(()=>m.style.display='none',2400)};
async function api(a,x={}){const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({a,...x})});const j=await r.json().catch(()=>({}));
 if(r.status==401&&a!='login'){showLogin();throw new Error('auth')}if(!r.ok)throw new Error(j.e||'Error');return j}
async function act(fn){if(busy)return;busy=1;$('#ld').style.display='block';try{await fn()}catch(e){if(e.message!='auth')toast(e.message,1)}finally{busy=0;$('#ld').style.display='none'}}
const cfgObj=()=>({v:2,emp:D.emp,ruc:D.ruc,mats:D.mats,alq:D.alq,chof:D.chof,sue:D.sue,hext:D.hext,jor:D.jor,pd:D.pd,pa:D.pa,maq:D.maq});
async function load(){const j=await api('all'),sc=(j.cfg||{}).cfg||{},c=Object.assign(clone(def),sc);let mig=false;
 if(!(sc.v>=2)){c.mats=clone(def.mats);c.maq=clone(def.maq);c.alq=clone(def.alq);c.emp=sc.emp||def.emp;c.v=2;mig=true}
 while(c.sue.length<c.chof.length)c.sue.push(0);
 Object.assign(D,c,{log:j.log});TIPOS.forEach(t=>D[t]=[]);
 j.regs.forEach(r=>{if(D[r.tipo])D[r.tipo].push({...r.data,id:r.id,f:r.f,anu:r.anu})});HOY=j.hoy;
 if(!F){const m=HOY.slice(0,7);F={ventas:{m:'d',v:HOY},alq:{m:'m',v:m},gas:{m:'m',v:m},mant:{m:'m',v:m},poli:{m:'m',v:m},hist:{m:'m',v:m},pag:{m:'m',v:m},graf:{m:'m',v:m}}}
 if(mig)await api('cfg',{cfg:cfgObj()});$('#lg').style.display='none';render()}
function showLogin(){$('#lg').style.display='flex'}
async function login(){await act(async()=>{$('#le').textContent='';try{await api('login',{u:$('#lu').value,p:$('#lp').value})}catch(e){$('#le').textContent=e.message;return}$('#lp').value='';await load()})}
async function logout(){try{await api('logout')}catch(e){}showLogin()}
const save=()=>act(async()=>{await api('cfg',{cfg:cfgObj()});toast('Guardado')});
const add=async(tipo,rec)=>{const r=await api('add',{tipo,rec});await load();return r};
const upd=async(id,patch)=>{await api('upd',{id,patch})};
// ---- deudas y cobros
const hasAbo=x=>D.abo.some(a=>a.ref==x.id&&!a.anu);
const cobDirect=x=>x.est!='Fiado'||(x.cob&&!hasAbo(x));
const saldo=x=>x.anu||x.est!='Fiado'||x.cob?0:Math.max(0,x.tot-sum(D.abo.filter(a=>a.ref==x.id&&!a.anu),a=>a.mon));
const cash=()=>[...D.ventas,...D.alq].filter(x=>!x.anu&&cobDirect(x)).map(x=>({f:x.f,m:x.tot})).concat(D.abo.filter(a=>!a.anu).map(a=>({f:a.f,m:a.mon})));
const cant=x=>x.mod=='cubico'?x.q+' cúbicos':x.q+(x.q==1?' camión':' camiones');
const deudas=()=>[...D.ventas.map(x=>({...x,tp:'ventas'})),...D.alq.map(x=>({...x,tp:'alq'}))].filter(x=>saldo(x)>0).map(x=>({id:x.id,tp:x.tp,f:x.f,cli:x.cli||'(sin nombre)',det:x.tp=='ventas'?x.mat+' · '+cant(x):x.maq+' · '+x.hr+' h',tot:x.tot,ab:x.tot-saldo(x),sal:saldo(x),dias:dias(x.f)})).sort((a,b)=>b.dias-a.dias);
const diasC=n=>`<span class="${n>30?'red':n>15?'org':''}">${n} días</span>`;
// ---- filtros día/mes/año
const flt=(k,modes=['d','m','a'])=>{const f=F[k],i=f.m=='d'?`<input type="date" value="${f.v}" onchange="F.${k}.v=this.value;render()">`:f.m=='m'?`<input type="month" value="${f.v}" onchange="F.${k}.v=this.value;render()">`:`<input type="number" value="${f.v}" onchange="F.${k}.v=this.value;render()">`,N={d:'Por día',m:'Por mes',a:'Por año'};
 return `<div class="row">${modes.map(m=>`<button class="sm ${f.m==m?'on':''}" onclick="fm('${k}','${m}')">${N[m]}</button>`).join('')}</div><div style="margin-top:6px">${i}</div>`};
const fm=(k,m)=>{F[k]={m,v:HOY.slice(0,m=='d'?10:m=='m'?7:4)};render()};
const fr=(k,a)=>a.filter(x=>x.f.startsWith(F[k].v)).reverse();
const tt=a=>`<div class="mut" style="margin:8px 0">${a.filter(x=>!x.anu).length} registros · Total: <b style="color:var(--ac)">${S(sum(a.filter(x=>!x.anu),x=>x.tot??x.mon??0))}</b></div>`;
// ---- estado de pantallas
let tab='inicio',ms='',P={},pg={i:0,t:'Sueldo'},av='hoy',cb=null,mtt='Cambio de aceite';
let st={mod:'camion',mat:0,q:1,precio:null,chof:0,est:'Pagado',dest:'Casa'},al={i:0,h:1,precio:null,chof:0,est:'Pagado'},pl={con:'Vigilancia (cuando viene)',mon:0,pol:'',nota:'',f:''};
const PC=['Vigilancia (cuando viene)','Turno completo','Visita / control','Otro'];
const MT=['Cambio de aceite','Filtros','Llantas','Frenos','Batería','Engrase','Soldadura','Mecánica general','Lavado','Repuesto','Otro'];
const tabs=[['inicio','🏠 Inicio'],['venta','🛒 Venta'],['alq','🚜 Alquiler'],['cob','💰 Por cobrar'],['gas','⛽ Petróleo'],['mant','🔧 Mantenimiento'],['poli','👮 Policía'],['asis','🕒 Asistencia'],['pag','👷 Pagos personal'],['graf','📊 Gráficos'],['rep','📄 Reportes'],['aj','⚙ Ajustes']];
function render(){$('#nav').innerHTML=tabs.map(([k,l])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('');$('#br').textContent=D.emp||'FINCA CHATE';
 $('#hoy').textContent=new Date().toLocaleDateString('es-PE',{weekday:'short',day:'2-digit',month:'short'});$('#v').innerHTML=V[tab]();
 if(tab=='rep')rep();if(tab=='asis'&&av=='hoy')D.asis.filter(a=>a.f==HOY).forEach(a=>calc(a.id))}
const cls=()=>[...new Set([...D.ventas,...D.alq].map(x=>x.cli).filter(Boolean))];
const clBox=()=>`<label>Cliente</label><input id="cli" list="cls" autocomplete="off"><datalist id="cls">${cls().map(c=>`<option value="${E(c)}">`).join('')}</datalist>`;
const cobBox=(s,fn)=>`<label>Método de pago</label><select id="met">${opts(['Efectivo','Yape','Plin','Transferencia','Depósito'])}</select><label>Estado del cobro</label><div class="row">${['Pagado','Fiado'].map(e=>`<button class="${s.est==e?'on':''}" onclick="${fn}.est='${e}';render()">${e}</button>`).join('')}</div>`;
const mg=()=>{const q=ms.toLowerCase(),cam=st.mod=='camion',r=D.mats.map((x,i)=>[x,i]).filter(([x])=>x.n.toLowerCase().includes(q));return r.length?r.map(([x,i])=>{const p=cam?x.pc:x.pq;return `<button class="${i==st.mat?'on':''}" onclick="st.mat=${i};st.precio=null;render()">${E(x.n)}<br><small>${p?S(p):'precio libre'}</small></button>`}).join(''):'<div class="mut">Sin resultados</div>'};
const foto=k=>`<div class="row"><button type="button" onclick="cam('${k}')">📷 Tomar foto ahora</button><label class="btnl">📱 Cámara del teléfono<input hidden type="file" accept="image/*" capture="environment" onchange="pv('${k}',this)"></label><label class="btnl">🖼 Galería<input hidden type="file" accept="image/*" onchange="pv('${k}',this)"></label></div><div id="${k}p" class="mut" style="margin-top:6px">${P[k]?`<img src="${P[k]}" style="max-width:140px;border-radius:8px"> ✓`:'Sin foto'}</div>`;
const tg=(id,k,l,on)=>`<button class="sm ${on?'on':''}" id="${k}${id}" onclick="this.classList.toggle('on')">${l}</button>`;
const on=id=>$('#'+id).classList.contains('on');
const V={
inicio(){const vh=[...D.ventas,...D.alq].filter(v=>v.f==HOY&&!v.anu),mes=HOY.slice(0,7),pres=D.asis.filter(a=>a.f==HOY),falta=D.chof.filter(c=>!pres.find(a=>a.c==c)),dd=deudas();
return `<div class="card"><h3>Hoy</h3><div class="kp"><div><small>Vendido hoy</small><b>${S(sum(vh,v=>v.tot))}</b></div><div><small>Cobrado hoy</small><b>${S(sum(cash().filter(r=>r.f==HOY),x=>x.m))}</b></div><div><small>Camiones hoy</small><b>${sum(D.ventas.filter(v=>v.f==HOY&&!v.anu&&v.mod!='cubico'),v=>v.q)}</b></div><div><small>Petróleo del mes</small><b>${S(sum(D.gas.filter(x=>x.f.startsWith(mes)&&!x.anu),x=>x.mon))}</b></div><div><small>Por cobrar (total)</small><b>${S(sum(dd,x=>x.sal))}</b></div><div><small>Presentes hoy</small><b>${pres.length}/${D.chof.length}</b></div></div>
${falta.length?`<div class="mut" style="margin-top:10px">Sin asistencia hoy: ${falta.map(E).join(', ')}</div>`:''}</div>
${dd.length?`<div class="card"><h3>⚠ Deudas más antiguas</h3><div class="wrap"><table><tr><th>Cliente</th><th>Debe</th><th>Hace</th></tr>${dd.slice(0,5).map(x=>`<tr><td>${E(x.cli)}</td><td>${S(x.sal)}</td><td>${diasC(x.dias)}</td></tr>`).join('')}</table></div><button class="sm" style="margin-top:8px" onclick="tab='cob';render()">Ver todas</button></div>`:''}`},
venta(){const m=D.mats[st.mat]||{n:'-',pc:0,pq:0},cam=st.mod=='camion',pr=st.precio??(cam?m.pc:m.pq),qs=cam?[1,2,3,4,5,6,7,8]:[5,10,15,20,30,40];
return `<div class="card"><h3>1. ¿Cómo se vende?</h3><div class="row"><button class="${cam?'on':''}" onclick="sm2('camion')">🚚 Camión de 10 cúbicos<br><small>entrega a casa o ferretería</small></button><button class="${!cam?'on':''}" onclick="sm2('cubico')">📦 Por cúbico<br><small>la ferretería recoge</small></button></div></div>
<div class="card"><h3>2. Material</h3><input placeholder="🔍 Buscar material..." value="${E(ms)}" oninput="ms=this.value;$('#mg').innerHTML=mg()" style="margin-bottom:10px"><div class="grid" id="mg">${mg()}</div><div class="mut" style="margin-top:8px">Seleccionado: <b style="color:var(--ac)">${E(m.n)}</b></div></div>
<div class="card"><h3>3. Cantidad (${cam?'camiones':'cúbicos'})</h3><div class="grid" style="grid-template-columns:repeat(${cam?8:6},1fr)">${qs.map(n=>`<button class="${n==st.q?'on':''}" onclick="st.q=${n};render()">${n}</button>`).join('')}</div>
<label>Otra cantidad</label><input type="number" min="0.5" step="0.5" value="${st.q}" oninput="st.q=Math.max(0.5,+this.value||1);updt()"></div>
<div class="card"><h3>4. Precio y cliente</h3><label>Precio por ${cam?'camión':'cúbico'} (puedes escribirlo)</label><input type="number" step="0.01" value="${pr||''}" oninput="st.precio=+this.value;updt()">
${cam?`<label>Destino</label><div class="row">${['Casa','Ferretería','Otro'].map(e=>`<button class="${st.dest==e?'on':''}" onclick="st.dest='${e}';render()">${e}</button>`).join('')}</div><label>Chofer</label><select onchange="st.chof=this.selectedIndex">${D.chof.map((c,i)=>`<option ${i==st.chof?'selected':''}>${E(c)}</option>`).join('')}</select>`:''}
${clBox()}${cobBox(st,'st')}<label>N° comprobante SUNAT (opcional)</label><input id="comp" placeholder="B001-0001">
<div style="margin-top:12px" class="mut">Total</div><div class="tot" id="tot">${S((pr||0)*st.q)}</div><button class="pri" onclick="act(venta)">REGISTRAR VENTA</button></div>
<div class="card"><h3>Historial de ventas</h3>${flt('ventas')}${tt(fr('ventas',D.ventas))}${tabla(fr('ventas',D.ventas),'ventas')}</div>`},
alq(){const m=D.alq[al.i]||{n:'-',p:0},pr=al.precio??m.p;
return `<div class="card"><h3>Alquiler de maquinaria</h3><label>Máquina</label><div class="grid">${D.alq.map((x,i)=>`<button class="${i==al.i?'on':''}" onclick="al.i=${i};al.precio=null;render()">${E(x.n)}<br><small>${S(x.p)} / hora</small></button>`).join('')}</div>
<label>Horas</label><div class="grid" style="grid-template-columns:repeat(8,1fr)">${[1,2,3,4,5,6,7,8].map(n=>`<button class="${n==al.h?'on':''}" onclick="al.h=${n};render()">${n}</button>`).join('')}</div>
<label>Otras horas</label><input type="number" min="0.5" step="0.5" value="${al.h}" oninput="al.h=Math.max(0.5,+this.value||1);ua()">
<label>Precio por hora (editable)</label><input type="number" step="0.01" value="${pr}" oninput="al.precio=+this.value;ua()">
<label>Operador</label><select onchange="al.chof=this.selectedIndex">${D.chof.map((c,i)=>`<option ${i==al.chof?'selected':''}>${E(c)}</option>`).join('')}</select>
${clBox()}${cobBox(al,'al')}<label>N° comprobante (opcional)</label><input id="comp">
<div style="margin-top:12px" class="mut">Total</div><div class="tot" id="tot">${S(pr*al.h)}</div><button class="pri" onclick="act(alquilar)">REGISTRAR ALQUILER</button></div>
<div class="card"><h3>Historial de alquileres</h3>${flt('alq')}${tt(fr('alq',D.alq))}${tabla(fr('alq',D.alq),'alq')}</div>`},
cob(){const dd=deudas(),by={};dd.forEach(x=>{const o=by[x.cli]||(by[x.cli]={s:0,d:0});o.s+=x.sal;o.d=Math.max(o.d,x.dias)});
const x=cb&&D[cb.tp].find(v=>v.id==cb.id),sl=x?saldo(x):0;
