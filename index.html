<head>

<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#20242d;--tx:#e8eaf0;--mut:#8b93a5;--ac:#f5a524;--ok:#2ecc71;--bad:#ff5d5d;--bd:#2b303b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
header b{color:var(--ac);letter-spacing:1px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--bg);position:sticky;top:48px;z-index:4}
nav button{flex:0 0 auto}
main{max-width:960px;margin:auto;padding:0 12px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
h3{margin:0 0 10px;font-size:16px}
label{display:block;color:var(--mut);font-size:12px;margin:10px 0 4px}
input,select{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:12px;font-size:16px}
button{background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:11px 14px;font-size:15px;cursor:pointer}
button.on,nav button.on{background:var(--ac);color:#111;border-color:var(--ac);font-weight:700}
button.pri{background:var(--ac);color:#111;font-weight:700;width:100%;margin-top:14px;padding:14px}
button.sec{background:var(--card2);color:var(--tx);border:1px solid var(--ac);width:100%;margin-top:10px;padding:14px;font-weight:700}
button.sm{padding:6px 10px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.tot{font-size:26px;color:var(--ac);font-weight:800}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left}th{color:var(--mut)}
.wrap{overflow-x:auto}.void{opacity:.4;text-decoration:line-through}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.kp div{background:var(--card2);border-radius:10px;padding:10px}.kp small{color:var(--mut);display:block}.kp b{font-size:18px}
.msg{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ok);color:#111;padding:10px 18px;border-radius:20px;display:none;z-index:99}
img.th{width:46px;height:46px;object-fit:cover;border-radius:6px;cursor:pointer}
.mut{color:var(--mut);font-size:12px}
.btnl{background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:11px 14px;text-align:center;cursor:pointer;font-size:15px;flex:1}
#cam{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}#cam video{flex:1;min-height:0;width:100%;object-fit:cover}
#lg{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}#lg .card{width:100%;max-width:360px}
#ld{position:fixed;top:0;left:0;right:0;height:3px;background:var(--ac);display:none;z-index:100}
.bars{display:flex;align-items:flex-end;gap:2px;height:150px;border-bottom:1px solid var(--bd)}.bars div{flex:1;background:var(--ac);border-radius:3px 3px 0 0;min-height:2px}
.bl{display:flex;gap:2px}.bl span{flex:1;text-align:center;font-size:9px;color:var(--mut)}
.hb{margin:8px 0}.hb .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}.hb .b{height:14px;background:var(--card2);border-radius:7px;overflow:hidden}.hb .b i{display:block;height:100%;border-radius:7px}
.red{color:var(--bad);font-weight:700}.org{color:var(--ac);font-weight:700}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
#pt{font-size:17px;font-weight:700;flex:1}
#side{position:fixed;top:0;left:0;bottom:0;width:240px;background:var(--card);border-right:1px solid var(--bd);overflow-y:auto;z-index:30;padding:calc(16px + env(safe-area-inset-top,0px)) 10px 16px}
.brand{padding:4px 10px 12px;border-bottom:1px solid var(--bd);margin-bottom:6px}.brand b{color:var(--ac);font-size:20px;letter-spacing:1px;display:block}.brand small{color:var(--mut)}
.gt{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:14px 10px 4px}
.ni{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:10px;margin:2px 0;font-size:15px}.ni:hover{background:var(--card2)}.ni.on{background:var(--ac);color:#111;font-weight:700}.ni span{width:22px;text-align:center}
#app{margin-left:240px}
main{max-width:1000px;margin:auto;padding:0 16px 40px}
#hb,#bb,#ov{display:none}
h3::before{content:'';display:inline-block;width:4px;height:14px;background:var(--ac);border-radius:2px;margin-right:8px;vertical-align:-1px}
input:focus,select:focus{outline:2px solid var(--ac);border-color:var(--ac)}
button:hover{filter:brightness(1.15)}
.card{box-shadow:0 1px 3px rgba(0,0,0,.35)}
tbody tr:hover td{background:#ffffff08}
.kp div{border-top:3px solid var(--ac)}
.ev{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:13px}.ev span:last-child{color:var(--mut);white-space:nowrap}
@media(max-width:899px){#side{transform:translateX(-100%);transition:transform .2s;width:280px}#side.open{transform:none}#app{margin-left:0}#hb{display:block;padding:8px 12px}#ov.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:25}
#bb{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
.bi{flex:1;background:none;border:0;border-radius:0;padding:8px 2px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;gap:2px;align-items:center}.bi span{font-size:20px}.bi.on{color:var(--ac);font-weight:700}
main{padding:0 10px 90px}#hoy{display:none}}

.bd{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:700;white-space:nowrap}.bd.g{background:#2ecc7126;color:var(--ok)}.bd.o{background:#f5a52426;color:var(--ac)}.bd.m{background:#8b93a526;color:var(--mut)}
.mn{font-variant-numeric:tabular-nums;white-space:nowrap}
.vh{text-align:left;line-height:1.35}.vh small{display:block;margin-top:4px;opacity:.85;font-weight:400}.vh.on small{opacity:.9}
.lv{margin-top:8px;color:var(--ok);font-weight:700;font-variant-numeric:tabular-nums}
#bol{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:60;display:none;align-items:center;justify-content:center;padding:12px}#bol .card{width:100%;max-width:420px;max-height:94vh;overflow-y:auto;margin:0}#bol .bimg{background:#fff;border-radius:8px;padding:4px}#bol img{max-width:100%;display:block;margin:auto}

.hd{display:flex;align-items:center;gap:10px}.clk{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}.clk b{font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:.5px}.clk small{color:var(--mut);font-size:11px}.clk small::first-letter{text-transform:uppercase}
#mes{width:auto;padding:6px 8px;font-size:13px;border-radius:8px}
#fcm{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:60;display:none;align-items:center;justify-content:center;padding:12px}#fcm .fcb{background:var(--card);border-radius:12px;padding:12px;width:100%;max-width:880px;height:94vh;display:flex;flex-direction:column;gap:10px}#fcm iframe{flex:1;width:100%;border:0;border-radius:8px;background:#fff}
.sec3{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}.sec3 button{flex:1;min-width:150px}
@media(max-width:899px){#hoy{display:none}.clk b{font-size:14px}#mes{max-width:132px}}
</style>
</head>
<body>
<div id="ld"></div>
<div id="lg"><div class="card"><h3 style="color:var(--ac);font-size:22px;text-align:center">FINCA CHATE</h3><div class="mut" style="text-align:center">Ingresa para continuar</div><label>Usuario</label><input id="lu" autocapitalize="none" autocomplete="username"><label>Contraseña</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()"><div id="le" style="color:var(--bad);margin-top:8px;min-height:18px"></div><button class="pri" style="margin-top:6px" onclick="login()">INGRESAR</button></div></div>
<div id="ov" onclick="menu(0)"></div>
<aside id="side"><div class="brand"><b id="br">FINCA CHATE</b><small>Sistema de control</small></div><div id="nav"></div></aside>
<div id="app"><header><button id="hb" onclick="menu(1)">☰</button><span id="pt"></span><span class="hd"><input type="month" id="mes" title="Mes de trabajo" onchange="setMes(this.value)"><span class="clk"><b id="clk"></b><small id="hoy"></small></span><button class="sm" onclick="logout()">Salir</button></span></header><main id="v"></main></div>
<div id="bb"></div>
<div id="bol"><div class="card"><h3>🧾 Boleta de venta</h3><div class="mut" id="boln" style="margin-bottom:8px;word-break:break-all"></div><div class="bimg"><img id="bolimg" alt="Boleta"></div><button class="pri" onclick="bolDown()">⬇ DESCARGAR PNG</button><button class="sec" onclick="bolCopy()">📋 Copiar boleta (imagen)</button><button class="sec" onclick="bolPrint()">🖨 Imprimir</button><button style="width:100%;margin-top:10px" onclick="bolX()">Cerrar</button></div></div>
<div id="fcm"><div class="fcb"><div class="row"><button class="pri" style="margin-top:0" onclick="facPrint()">🖨 Imprimir / Guardar como PDF</button><button onclick="facX()">Cerrar</button></div><iframe id="fcf"></iframe></div></div>
<div class="msg" id="msg"></div>
<div id="cam"><video id="cv" autoplay playsinline muted></video><div class="row" style="padding:12px"><button onclick="camX()">Cancelar</button><button class="on" onclick="camS()">📸 Capturar</button></div></div>
<script>
const $=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const def={v:3,emp:'FINCA CHATE',ruc:'',
mats:[['Arena gruesa',400,50],['Afirmado',350,45],['Piedra de 1/2',450,60],['Piedra 6/7',480,60],['Arena fina',480,60],['Piedra de sanja',450,45],['Tierra de chacra',0,80],['Hormigón',350,40],['Confitillo',500,60],['Piedra 3/4',400,50]].map(([n,pc,pq])=>({n,pc,pq})),
ral:[{n:'Cargador frontal',p:120},{n:'Excavadora',p:200},{n:'Retroexcavadora',p:110}],
chof:['Chofer 1','Chofer 2','Chofer 3','Chofer 4'],sue:[0,0,0,0],hext:10,jor:8,
maq:['Volquete 1','Volquete 2','Volquete 3','Burrito','Retroexcavadora'],
ctas:['Efectivo','Yape','Plin','BCP','Interbank','BBVA','Otros'],cgasto:'Efectivo',dir:'',ser:'F001'};
const clone=o=>JSON.parse(JSON.stringify(o));
const TIPOS=['ventas','alq','abo','gas','mant','poli','com','asis','pagos','fac','caja'];
let D={...clone(def)},HOY='',MES='',F=null,busy=0,CK,CS;TIPOS.forEach(t=>D[t]=[]);D.log=[];
const now=()=>new Date().toLocaleTimeString('es-PE',{hourCycle:'h23',hour:'2-digit',minute:'2-digit',second:'2-digit'});
const S=n=>'S/ '+(+n||0).toFixed(2);
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const opts=a=>a.map(x=>`<option>${E(x)}</option>`).join('');
function wk(e,s){if(!e||!s)return 0;const q=t=>{const[h,m,x]=t.split(':');return h*3600+ +m*60+(+x||0)};let d=q(s)-q(e);if(d<0)d+=86400;return d/3600}
const hms=h=>{const t=Math.round((h||0)*3600),m=Math.floor(t%3600/60),x=t%60;return Math.floor(t/3600)+' h '+String(m).padStart(2,'0')+' min '+String(x).padStart(2,'0')+' s'};
const t8=t=>!t?'—':t.length==5?t+':00':t;
const hrs=a=>wk(a.e,a.s);
const fd=f=>f?f.split('-').reverse().join('/'):'';
const dias=f=>Math.max(0,Math.round((new Date(HOY+'T12:00:00')-new Date(f+'T12:00:00'))/864e5));
const toast=(t,bad)=>{const m=$('#msg');m.textContent=t;m.style.background=bad?'var(--bad)':'var(--ok)';m.style.display='block';clearTimeout(m.t);m.t=setTimeout(()=>m.style.display='none',2400)};
async function api(a,x={}){const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({a,...x})});const j=await r.json().catch(()=>({}));
 if(r.status==401&&a!='login'){showLogin();throw new Error('auth')}if(!r.ok)throw new Error(j.e||'Error');return j}
async function act(fn){if(busy)return;busy=1;$('#ld').style.display='block';try{await fn()}catch(e){if(e.message!='auth')toast(e.message,1)}finally{busy=0;$('#ld').style.display='none'}}
const cfgObj=()=>({v:3,emp:D.emp,ruc:D.ruc,mats:D.mats,ral:D.ral,chof:D.chof,sue:D.sue,hext:D.hext,jor:D.jor,maq:D.maq,ctas:D.ctas,cgasto:D.cgasto,dir:D.dir,ser:D.ser});
async function load(){const j=await api('all'),sc=(j.cfg||{}).cfg||{},c=Object.assign(clone(def),sc);let mig=false;
 if(!(sc.v>=2)){c.mats=clone(def.mats);c.maq=clone(def.maq);c.emp=sc.emp||def.emp;mig=true}
 if(!(sc.v>=3)){const m=clone(def.ral);(Array.isArray(sc.alq)?sc.alq:[]).filter(o=>o&&typeof o.n=='string'&&o.n&&!('f' in o)&&!('maq' in o)&&isFinite(+o.p)).forEach(o=>{if(!m.find(z=>z.n==o.n))m.push({n:o.n,p:+o.p})});c.ral=m;mig=true}
 if(!Array.isArray(c.ral))c.ral=clone(def.ral);delete c.alq;c.v=3;
 while(c.sue.length<c.chof.length)c.sue.push(0);if(!Array.isArray(c.ctas)||!c.ctas.length)c.ctas=clone(def.ctas);if(!c.ctas.includes('Otros'))c.ctas.push('Otros');if(!c.ctas.includes(c.cgasto))c.cgasto='Efectivo';
 Object.assign(D,c,{log:j.log,usr:j.usr||''});TIPOS.forEach(t=>D[t]=[]);
 j.regs.forEach((r,i)=>{if(D[r.tipo])D[r.tipo].push({...r.data,id:r.id,f:r.f,anu:r.anu,_o:i})});HOY=j.hoy;
 if(!F){if(!MES)MES=HOY.slice(0,7);resetF()}
 if(mig)await api('cfg',{cfg:cfgObj()});$('#lg').style.display='none';render()}
function showLogin(){$('#lg').style.display='flex'}
async function login(){await act(async()=>{$('#le').textContent='';try{await api('login',{u:$('#lu').value,p:$('#lp').value})}catch(e){$('#le').textContent=e.message;return}$('#lp').value='';await load()})}
async function logout(){try{await api('logout')}catch(e){}showLogin()}
const save=()=>act(async()=>{await api('cfg',{cfg:cfgObj()});toast('Guardado')});
const add=async(tipo,rec)=>{const r=await api('add',{tipo,rec});await load();return r};
const upd=async(id,patch)=>{await api('upd',{id,patch})};
// ---- deudas y cobros
const hasAbo=x=>D.abo.some(a=>a.ref==x.id&&!a.anu);
const cobDirect=x=>x.est!='Fiado'||(x.cob&&!hasAbo(x));
const saldo=x=>x.anu||x.est!='Fiado'||x.cob?0:Math.max(0,x.tot-sum(D.abo.filter(a=>a.ref==x.id&&!a.anu),a=>a.mon));
const cash=()=>[...D.ventas,...D.alq].filter(x=>!x.anu&&cobDirect(x)).map(x=>({f:x.f,m:x.tot})).concat(D.abo.filter(a=>!a.anu).map(a=>({f:a.f,m:a.mon})));
const cant=x=>x.mod=='cubico'?x.q+' cúbicos':x.q+(x.q==1?' camión':' camiones');
const deudas=()=>[...D.ventas.map(x=>({...x,tp:'ventas'})),...D.alq.map(x=>({...x,tp:'alq'}))].filter(x=>saldo(x)>0).map(x=>({id:x.id,tp:x.tp,f:x.f,cli:x.cli||'(sin nombre)',det:x.tp=='ventas'?x.mat+' · '+cant(x):x.maq+' · '+x.hr+' h',tot:x.tot,ab:x.tot-saldo(x),sal:saldo(x),dias:dias(x.f)})).sort((a,b)=>b.dias-a.dias);
const diasC=n=>`<span class="${n>30?'red':n>15?'org':''}">${n} días</span>`;
// ---- filtros día/mes/año
const flt=(k,modes=['d','m','a'])=>{const f=F[k],i=f.m=='d'?`<input type="date" value="${f.v}" onchange="F.${k}.v=this.value;render()">`:f.m=='m'?`<input type="month" value="${f.v}" onchange="F.${k}.v=this.value;render()">`:`<input type="number" value="${f.v}" onchange="F.${k}.v=this.value;render()">`,N={d:'Por día',m:'Por mes',a:'Por año'};
 return `<div class="row">${modes.map(m=>`<button class="sm ${f.m==m?'on':''}" onclick="fm('${k}','${m}')">${N[m]}</button>`).join('')}</div><div style="margin-top:6px">${i}</div>`};
const MESACT=()=>HOY.slice(0,7);
const ult=m=>{const[y,mo]=m.split('-');return m+'-'+String(new Date(+y,+mo,0).getDate()).padStart(2,'0')};
const mesN=()=>{const t=new Date(MES+'-15T12:00:00').toLocaleDateString('es-PE',{month:'long',year:'numeric'});return t.charAt(0).toUpperCase()+t.slice(1)};
function resetF(){F={};['ventas','alq','gas','mant','poli','hist','pag','graf','com','abo','fac','caja'].forEach(k=>F[k]={m:'m',v:MES});if(MES==MESACT())F.ventas={m:'d',v:HOY}}
function setMes(v){if(!v)return;MES=v;resetF();render()}
const fm=(k,m)=>{F[k]={m,v:m=='d'?(MES==MESACT()?HOY:MES+'-01'):m=='m'?MES:MES.slice(0,4)};render()};
const fr=(k,a)=>a.filter(x=>x.f.startsWith(F[k].v)).reverse();
const tt=a=>`<div class="mut" style="margin:8px 0">${a.filter(x=>!x.anu).length} registros · Total: <b style="color:var(--ac)">${S(sum(a.filter(x=>!x.anu),x=>x.tot??x.mon??0))}</b></div>`;
// ---- estado de pantallas
let tab='inicio',ms='',P={},pg={i:0,t:'Sueldo'},av='hoy',cb=null,mtt='Cambio de aceite';
let st={mod:'camion',mat:0,q:1,precio:null,chof:0,est:'Pagado',dest:'Casa'},al={i:0,h:1,precio:null,chof:0,est:'Pagado',nom:''},cm={t:'Almuerzo',sel:[],mon:0,f:'',nota:''},pl={con:'',mon:0,pol:'',nota:'',f:''};
const PCV=['Vigilancia (cuando viene)','Turno completo','Visita / control','Otro'];
let af='',gv={sel:[],modo:'cada',mon:'',gal:'',n:'',f:'',c:0};
const MT=['Cambio de aceite','Filtros','Llantas','Frenos','Batería','Engrase','Soldadura','Mecánica general','Lavado','Repuesto','Otro'];
const GR=[[null,[['inicio','🏠','Inicio']]],['Ventas',[['venta','🛒','Nueva venta'],['alq','🚜','Alquiler'],['fac','🧾','Facturas'],['cob','💰','Por cobrar']]],['Gastos',[['gas','⛽','Petróleo'],['mant','🔧','Mantenimiento'],['poli','👮','Policía'],['com','🍽','Comidas']]],['Personal',[['asis','🕒','Asistencia'],['pag','👷','Pagos personal']]],['Empresa',[['caja','🏦','Caja y saldos'],['ajc','➖','Retirar / Ajustar']]],['Análisis',[['graf','📊','Gráficos'],['rep','📄','Reportes']]],['Sistema',[['aj','⚙️','Ajustes']]]];
const TL=Object.fromEntries(GR.flatMap(([,l])=>l).map(([k,i,n])=>[k,[i,n]]));
const menu=o=>{$('#side').classList.toggle('open',!!o);$('#ov').classList.toggle('open',!!o)};
const go=k=>{tab=k;menu(0);render();scrollTo(0,0)};
function render(){$('#nav').innerHTML=GR.map(([g,l])=>(g?`<div class="gt">${g}</div>`:'')+l.map(([k,i,n])=>`<button class="ni ${k==tab?'on':''}" onclick="go('${k}')"><span>${i}</span>${n}</button>`).join('')).join('');
